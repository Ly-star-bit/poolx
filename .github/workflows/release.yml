name: Release
permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version/tag to publish, for example v1.0.0-beta"
        required: false
        type: string
  push:
    tags: ["v*"]

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.version.outputs.should_run }}
      version: ${{ steps.version.outputs.version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version metadata
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          SHOULD_RUN=true
          POINTED_TAG="$(git tag --points-at HEAD --list 'v*' | sort -V | tail -n1)"
          INPUT_VERSION="${INPUT_VERSION//[[:space:]]/}"

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME}"
          elif [[ -n "$INPUT_VERSION" ]]; then
            VERSION="$INPUT_VERSION"
          elif [[ -n "$POINTED_TAG" ]]; then
            VERSION="$POINTED_TAG"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "workflow_dispatch requires an explicit version input when HEAD is not tagged" >&2
            exit 1
          elif [[ "${GITHUB_REF}" == refs/heads/main ]]; then
            echo "main branch release requires the current commit to be tagged" >&2
            exit 1
          else
            echo "unable to resolve release version from the current ref" >&2
            exit 1
          fi

          echo "should_run=$SHOULD_RUN" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" =~ ^v[0-9]+(\.[0-9]+)*$ ]]; then
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          fi

  build-frontend:
    needs: prepare
    if: needs.prepare.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
          cache-dependency-path: |
            server/web/pnpm-lock.yaml
            server/zashboard/pnpm-lock.yaml

      - name: Build Web Frontend
        env:
          CI: ""
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          cd server/web
          pnpm install --frozen-lockfile
          NEXT_PUBLIC_APP_VERSION="$VERSION" pnpm build

      - name: Build Zashboard
        env:
          CI: ""
        run: |
          cd server/zashboard
          pnpm install --frozen-lockfile
          pnpm build

      - name: Package Frontend Assets
        run: |
          tar -czf frontend-assets.tar.gz -C server web/build zashboard/dist

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-assets
          path: frontend-assets.tar.gz
          retention-days: 1

  build-binaries:
    needs:
      - prepare
      - build-frontend
    if: needs.prepare.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            asset_name: poolx-server-linux-amd64
            archive_type: tar
          - goos: linux
            goarch: arm64
            asset_name: poolx-server-linux-arm64
            archive_type: tar
          - goos: darwin
            goarch: amd64
            asset_name: poolx-server-darwin-amd64
            archive_type: tar
          - goos: darwin
            goarch: arm64
            asset_name: poolx-server-darwin-arm64
            archive_type: tar
          - goos: windows
            goarch: amd64
            asset_name: poolx-server-windows-amd64.exe
            archive_type: zip
          - goos: windows
            goarch: arm64
            asset_name: poolx-server-windows-arm64.exe
            archive_type: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Frontend Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-assets

      - name: Extract Frontend Assets
        run: |
          tar -xzf frontend-assets.tar.gz -C server
          test -f server/web/build/index.html || { echo "web/build/index.html missing"; exit 1; }
          test -f server/zashboard/dist/index.html || { echo "zashboard/dist/index.html missing"; exit 1; }

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod

      - name: Build Server
        working-directory: server
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          ASSET_NAME: ${{ matrix.asset_name }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          go mod download
          mkdir -p ../dist
          go build -trimpath -ldflags "-s -w -X 'poolx/internal/pkg/common.Version=$VERSION'" -o "../dist/$ASSET_NAME" .

      - name: Package Archive
        working-directory: dist
        env:
          ASSET_NAME: ${{ matrix.asset_name }}
          ARCHIVE_TYPE: ${{ matrix.archive_type }}
          VERSION: ${{ needs.prepare.outputs.version }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          ARCHIVE_NAME="poolx-${VERSION}-${GOOS}-${GOARCH}"
          if [ "$ARCHIVE_TYPE" = "zip" ]; then
            zip -j "${ARCHIVE_NAME}.zip" "$ASSET_NAME"
          else
            tar -czf "${ARCHIVE_NAME}.tar.gz" "$ASSET_NAME"
          fi

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          retention-days: 1

  release:
    needs:
      - prepare
      - build-binaries
    if: needs.prepare.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download Server Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "server-*"
          path: dist
          merge-multiple: true

      - name: Generate Checksums
        working-directory: dist
        run: |
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          name: ${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          draft: false
          prerelease: ${{ needs.prepare.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
